syntax = "proto3";

package rvm.v1;

import "rvm/v1/common.proto";

message HelloRequest {
  ProtocolVersion requested_protocol = 1;
  string client_name = 2;
  uint32 client_pid = 3;
  string token = 4;
}

message HelloResponse {
  ProtocolVersion protocol = 1;
  string engine_version = 2;
  string capability = 3;
  repeated BackendKind backends = 4;
  AvailabilityReport availability = 5;
  EnvironmentFacts environment = 6;
  bool rvm_available = 7;
  string unavailable_reason = 8;
}

message PingRequest {
  uint64 nonce = 1;
}

message PongResponse {
  uint64 nonce = 1;
}

message ShutdownRequest {
  string reason = 1;
}

message ShutdownResponse {
  bool accepted = 1;
}
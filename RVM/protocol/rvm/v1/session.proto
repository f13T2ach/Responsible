syntax = "proto3";

package rvm.v1;

import "rvm/v1/common.proto";

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_CREATING = 1;
  SESSION_STATE_READY = 2;
  SESSION_STATE_STOPPING = 3;
  SESSION_STATE_CLOSED = 4;
  SESSION_STATE_FAILED = 5;
}

message ExposedVariable {
  string name = 1;
  string value = 2;
}

message CreateSessionRequest {
  string client_id = 1;
  string workspace_root = 2;
  repeated string masked_patterns = 3;
  SandboxPolicy policy = 4;
  uint32 memory_mb = 5;
  uint32 vcpu_count = 6;
  bool network_access = 7;
  bool prewarm = 8;
  bool overlay_workspace = 9;
  string overlay_drive = 10;
  // Stable per-workspace storage name (`<workspace>_<id>`); empty keeps the
  // legacy per-session scratch directory.
  string storage_key = 11;
  // Environment variables the user chose to expose to sandboxed processes.
  // The engine builds the rest of the child environment itself.
  repeated ExposedVariable exposed_environment = 12;
  // Legacy per-session tool grants. New hosts authorize tools once in the
  // global ACL list and send tool_access instead.
  repeated string tool_paths = 13;
  // Tools selected for this session. The capability SID already carries the
  // persistent ACL grant; the engine only verifies it against the user's
  // authorized list and adds the capability to child tokens.
  repeated ToolAccess tool_access = 14;
  // Host serial devices the user exposed to this session (COM port names).
  // The engine grants the sandbox identity access to exactly these devices and
  // revokes it when the session stops; all other devices stay masked.
  repeated string device_paths = 15;
}

message ToolAccess {
  string path = 1;
  string capability_sid = 2;
  string name = 3;
}

message SetToolAuthorizationsRequest {
  repeated ToolAccess tools = 1;
}

message Session {
  uint64 session_id = 1;
  string workspace_root = 2;
  BackendKind backend = 3;
  SessionState state = 4;
  uint64 created_unix_ms = 5;
  EnvironmentFacts environment = 6;
  string virtual_workspace_root = 7;
}

message CreateSessionResponse {
  Session session = 1;
}

message CloseSessionRequest {
  uint64 session_id = 1;
  bool keep_diff = 2;
  string reason = 3;
}

message CloseSessionResponse {
  bool closed = 1;
}

message GetSessionRequest {
  uint64 session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}